# EA Explorer's PostgreSQL access rules with a standby (phase 36.3, D527): as the image's own, plus the replication
# login from any host on the backend or private network (the password is EAX_REPLICATION_PASSWORD).
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     eax_replicator  all                     scram-sha-256
host    all             all             all                     scram-sha-256
