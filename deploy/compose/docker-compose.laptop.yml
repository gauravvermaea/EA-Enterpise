# Laptop deployment: everything on one machine, small limits.
# Used together with docker-compose.yml:  .\eax.ps1 up
services:
  api:
    # Everything goes through nginx (D107): https://localhost/api/docs and https://localhost/mcp, and on
    # this laptop also http://localhost/api/docs and http://localhost/mcp (EAX_HTTP_API_MCP).
    deploy:
      resources:
        limits: { memory: 768m }
  reports:
    deploy:
      resources:
        limits: { memory: 2g }
  dms:
    deploy:
      resources:
        limits: { memory: 2g }
  keycloak:
    environment:
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50"
    deploy:
      resources:
        limits: { memory: 1g }
