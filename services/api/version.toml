# EA Explorer version.
# The API reports this version, and the database must be at the same version: every migration that
# moves the version writes it to core.schema_versions. The heartbeat shows a warning when the two
# differ (for example a new API image against a database whose migrations did not run).
# Bump it in every build phase: phase N is 0.N.0 until version 1.0; additions between phases
# take the next patch number (0.2.1).
version = "0.12.0"
