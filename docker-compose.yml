# EA Explorer - base stack (phase 0)
#
# Start with the helper script (it reads work/eaexplorer.env and the override for your deployment kind):
#   Windows:  .\eax.ps1 up
#   Linux/macOS: ./eax.sh up
# or directly:
#   docker compose --env-file work/eaexplorer.env -f docker-compose.yml -f deploy/compose/docker-compose.laptop.yml up -d --build
#
# Networks: only the proxy publishes ports. "backend" is internal: databases and the Mayan broker are never
# reachable from outside, nor from web or drawio.

name: eaexplorer

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

networks:
  frontend:
  backend:
    internal: true
  terminal:          # only the proxy and the operations helper: interactive terminals (D214)
    internal: true

volumes:
  eax-pgdata:
  eax-docs:
  eax-imports:
  eax-exports:
  eax-tls:
  eax-rendered:      # files rendered by the setup service from eaexplorer.env (Superset sample)
  eax-kc-import:     # the Keycloak realm rendered by the setup service
  eax-superset-home:

services:

  # ---------------------------------------------------------------- one-shot setup (ours)
  # Renders the Keycloak realm and the Superset sample from the config file, and creates a
  # self-signed TLS certificate if none exists. Runs on every start; it is idempotent.
  setup:
    build:
      context: ./services/api
    image: eaexplorer/api:${EAX_VERSION:-dev}
    command: ["python", "-m", "eax.setup"]
    user: "0"            # writes the certificate and rendered files into volumes owned by root
    env_file: work/eaexplorer.env
    volumes:
      - ${EAX_TLS_DIR:-eax-tls}:/tls
      - eax-rendered:/rendered
      - eax-kc-import:/kc-import
      - ./deploy:/deploy:ro
    network_mode: none
    <<: *logging

  # ---------------------------------------------------------------- entry point (out of the box)
  proxy:
    image: ${EAX_IMAGE_NGINX:-nginx:1.30-alpine}
    <<: [*restart, *logging]
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "${EAX_HTTPS_PORT:-443}:443"
      # plain http: laptops bind it to this computer only (EAX_HTTP_BIND=127.0.0.1), D107
      - "${EAX_HTTP_BIND:-0.0.0.0}:${EAX_HTTP_PORT:-80}:80"
      # machine access with client certificates (phase 25, D366): a port of its own, never asked of browsers
      - "${EAX_MTLS_PORT:-9443}:9443"
    environment:
      EAX_HOSTNAME: ${EAX_HOSTNAME:-localhost}
      EAX_HTTPS_PORT: ${EAX_HTTPS_PORT:-443}
      EAX_HTTP_PORT: ${EAX_HTTP_PORT:-80}
      EAX_MTLS_PORT: ${EAX_MTLS_PORT:-9443}
      EAX_HTTP_API_MCP: ${EAX_HTTP_API_MCP:-false}
      EAX_HSTS: ${EAX_HSTS:-}
      # the screens' Content-Security-Policy (R3.12, D672): enforced; Content-Security-Policy-Report-Only only reports
      EAX_CSP_HEADER: ${EAX_CSP_HEADER:-Content-Security-Policy}
      # scale-out (phase 36.3, D521): where the API, the library and the views service answer; another host (or a DNS
      # name listing several hosts, spread by nginx) when they run elsewhere
      EAX_API_UPSTREAM: ${EAX_API_UPSTREAM:-api:8000}
      EAX_LIBRARY_UPSTREAM: ${EAX_LIBRARY_UPSTREAM:-library:8100}
      EAX_VIEWS_UPSTREAM: ${EAX_VIEWS_UPSTREAM:-views:8110}
      EAX_OPERATIONS_UPSTREAM: ${EAX_OPERATIONS_UPSTREAM:-operations:8120}   # R2.27 part 2
      EAX_PERSONAL_UPSTREAM: ${EAX_PERSONAL_UPSTREAM:-personal:8130}         # R2.53
      NGINX_ENVSUBST_FILTER: "^EAX_"
    volumes:
      - ./deploy/proxy/templates:/etc/nginx/templates:ro
      - ./deploy/proxy/static:/etc/nginx/eax:ro          # the maintenance page (D230)
      - ./work/proxy:/eax-proxy:ro                        # work/proxy/maintenance switches it on (restores, upgrades)
      - ${EAX_TLS_DIR:-eax-tls}:/etc/nginx/tls:ro
    networks: [frontend, terminal]

  # ---------------------------------------------------------------- our containers
  web:
    build:
      context: ./services/web
    image: eaexplorer/web:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    environment:
      EAX_HOSTNAME: ${EAX_HOSTNAME:-localhost}
      EAX_HTTPS_PORT: ${EAX_HTTPS_PORT:-443}
      EAX_VERSION: ${EAX_VERSION:-dev}
      EAX_DEPLOYMENT: ${EAX_DEPLOYMENT:-laptop}
      EAX_KEYCLOAK_REALM: ${EAX_KEYCLOAK_REALM:-eaexplorer}
    networks: [frontend]

  # The API and job servers (D249): EAX_API_SERVERS copies of this container (eax up --scale api=N; the console adds or
  # removes copies at once); nginx spreads API calls across them and each runs background jobs. No container_name and
  # no published port, so it can have several copies; stopping one waits for the jobs it runs to finish.
  api:
    build:
      context: ./services/api
    image: eaexplorer/api:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    stop_grace_period: 2m
    env_file: work/eaexplorer.env
    environment:
      EAX_ROLE: api            # entrypoint runs migrations, then the web API and the job runner
      EAX_SERVE: core          # the main API: what the operations and personal data services serve is theirs (R2.27, R2.53)
      EAX_OPS_URL: http://ops:8090                       # the operations helper (phase 10, D183)
      EAX_OPS_TOKEN: ${EAX_OPS_TOKEN:-eax-ops-laptop}
      # the build shown top left with the release (R2.47): set by eax from git when it starts the stack, or by CI
      EAX_BUILD: ${EAX_BUILD:-dev}
      EAX_BUILT_AT: ${EAX_BUILT_AT:-}
      EAX_COMMIT: ${EAX_COMMIT:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # the import folder; deliveries from other systems arrive in deliveries/<model>/<source>/incoming (phase 34, D466):
      # set EAX_IMPORT_DIR to a host folder to map it to SFTP or a share
      - ${EAX_IMPORT_DIR:-eax-imports}:/data/imports
      - ${EAX_EXPORT_DIR:-eax-exports}:/data/exports
      - ${EAX_BACKUP_DIR:-./work/backups}:/data/backups   # every backup: work/backups, or the mounted folder EAX_BACKUP_DIR (D226, R2.44)
      - ./work:/eax-work:ro      # services.env: which optional services are on (D191); maintenance.json while restoring
      # the project library's template files (phase 13, D262): library/templates, or the folder EAX_LIBRARY_DIR names;
      # the TOGAF files you download are kept there and never committed (library/templates/togaf/.gitignore)
      - ${EAX_LIBRARY_DIR:-./library}:/data/library:ro
      # EA Explorer's own template library (D264), shipped in the release whatever EAX_LIBRARY_DIR says
      - ./library/templates/ea-explorer:/data/ea-explorer-templates:ro
      # the industry packs shipped in the repository (owner, 10 Nov 2026, D546): uploaded into Documents at start-up;
      # EAX_PACKS_DIR: another folder of packs to load with `eax packs load` (empty by default)
      - ./library/industry-packs:/data/industry-packs:ro
      - ${EAX_PACKS_DIR:-./work/packs}:/data/packs-extra:ro
      # EA Explorer's own documents of the running version, for the Documentation page (D550)
      - ./docs:/data/docs/docs:ro
      - ./README.md:/data/docs/README.md:ro
      - ./eaxcli/help.txt:/data/docs/eaxcli/help.txt:ro
      - ./releases:/data/docs/releases:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backup:
    build:
      context: ./services/backup
    image: eaexplorer/backup:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    env_file: work/eaexplorer.env
    environment:          # where the library's and the views' databases are (their own servers in production, D410)
      EAX_LIBRARY_DB_HOST: ${EAX_LIBRARY_DB_HOST:-db}
      EAX_VIEWS_DB_HOST: ${EAX_VIEWS_DB_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    volumes:              # every named volume with state (D410); tests/test_backup_coverage.py keeps this list whole
      - ${EAX_BACKUP_DIR:-./work/backups}:/backups
      - ${EAX_DOCS_DIR:-eax-docs}:/mayan           # written only by a restore (D216)
      - ${EAX_TLS_DIR:-eax-tls}:/tls               # the certificate, backed up and restored with the rest
      - eax-superset-home:/superset-home           # Superset's home: its secret key and uploads
      - ${EAX_IMPORT_DIR:-eax-imports}:/imports    # the API's import folder
      - ${EAX_EXPORT_DIR:-eax-exports}:/exports    # the API's export folder
      - ${EAX_PERSIST_DIR:-./persist}:/persist     # the settings that survive resets (D558)
    networks: [backend]

  # The library (phase 15.2, D346): the organisation's and the projects' libraries, a service of its own with its own
  # database (eaxlibrary, made on first start), migrations and API (/api/library/v1). On a laptop its database shares the
  # PostgreSQL server; in production it gets its own (scale-out story). Optional: EAX_SERVICE_LIBRARY; started after the core.
  library:
    build:
      context: ./services/library
    image: eaexplorer/library:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    env_file: work/eaexplorer.env
    environment:
      EAX_API_INTERNAL_URL: http://api:8000
      EAX_LIBRARY_DB_HOST: ${EAX_LIBRARY_DB_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # the running version's documents, kept as the "EA Explorer documentation" folder at every start (D550)
      - ./docs:/data/docs/docs:ro
      - ./README.md:/data/docs/README.md:ro
      - ./eaxcli/help.txt:/data/docs/eaxcli/help.txt:ro
      - ./releases:/data/docs/releases:ro
      - ./services/api/version.toml:/data/docs/version.toml:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/api/library/v1/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Drawn views (phase 28, D405, D408): every model's draw.io views and versions, and the models' own view definitions,
  # a service of its own with its own database (eaxviews, made on first start), migrations and API (/api/views/v1). It
  # asks the main API who the person is and what they may do with the model. Optional: EAX_SERVICE_VIEWS.
  views:
    build:
      context: ./services/views
    image: eaexplorer/views:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    env_file: work/eaexplorer.env
    environment:
      EAX_API_INTERNAL_URL: http://api:8000
      EAX_VIEWS_DB_HOST: ${EAX_VIEWS_DB_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8110/api/views/v1/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The operations service (R2.27 part 2; owner, 12 and 13 Nov 2026): the running of the installation, its own
  # container and API (/api/v1/operations: housekeeping, retention, usage, deployments, updates) and its own schema
  # (operations, EAX_OPERATIONS_DB_URL, D630). The API's code and image, started with EAX_SERVE=operations; the front
  # door sends its prefix here. It waits for the main API to bring the database up to date.
  operations:
    image: eaexplorer/api:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    env_file: work/eaexplorer.env
    environment:
      EAX_SERVE: operations
      EAX_OPS_URL: http://ops:8090
      EAX_OPS_TOKEN: ${EAX_OPS_TOKEN:-eax-ops-laptop}
      EAX_BUILD: ${EAX_BUILD:-dev}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./work:/eax-work:ro      # updates and deployments read the work folder as the API does
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8120/api/v1/operations/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # The personal data service (R2.53; owner, 12 and 13 Nov 2026): each person's notifications, requests, favourites,
  # saved views, skills and settings, its own container and API (/api/v1/me/...) and its own schema (personal,
  # EAX_PERSONAL_DB_URL, D630). When it is down the rest keeps working; notifications made meanwhile wait and are sent.
  personal:
    image: eaexplorer/api:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    env_file: work/eaexplorer.env
    environment:
      EAX_SERVE: personal
      EAX_BUILD: ${EAX_BUILD:-dev}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8130/api/v1/me/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # The test runner (phase 36.1, D367, D523): the API's code with pytest, Playwright and Chromium, and pip-audit. Only for a
  # test run (profile "test"): `eax test` builds and runs it; the Health page asks the operations helper, which starts it
  # with the api container's settings. It makes its own test database (EAX_TEST_DB_NAME, default eaxtest) and its own
  # copy of the API on it, so the installation's data is never touched; results go to the database and work/tests.
  testrunner:
    profiles: ["test"]
    build:
      context: ./services/api
      dockerfile: Dockerfile.test
    image: eaexplorer/testrunner:${EAX_VERSION:-dev}
    env_file: work/eaexplorer.env
    environment:
      EAX_TEST_RESULTS: /results
      EAX_TEST_DATA: /testdata                      # the test data, shared with the outside test bench (D580)
    volumes:
      - ./work/tests:/results
      - ./testbench/data:/testdata:ro               # testbench/data: deliveries, workbooks, uploads, expected results
      - ${EAX_PERSIST_DIR:-./persist}:/persist:ro   # read only: the self-test checks the settings there are valid JSON (D577)
    networks: [frontend, backend]
    <<: *logging

  # The test runner as an always-on service (R2.44, D635): on a container platform with no Docker socket
  # (EAX_PLATFORM=managed, profile "platform") it waits for the runs the API queues and runs them itself; the security
  # scanners need the socket and are left out there. On a laptop or server the operations helper starts the runner.
  testrunner-service:
    profiles: ["platform"]
    image: eaexplorer/testrunner:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    entrypoint: ["python", "-m", "eax.testing.waiter"]
    env_file: work/eaexplorer.env
    environment:
      EAX_PLATFORM: managed
      EAX_TEST_DATA: /testdata
    networks: [frontend, backend]

  # ---------------------------------------------------------------- data (out of the box)
  # Operations helper (phase 10, D183): restarts the system when a Super Admin asks in the administration console.
  # It reaches the Docker engine (its socket), so it is only on the internal network, publishes no port, and every
  # request needs EAX_OPS_TOKEN; it restarts only this installation's containers. It also switches the optional
  # services on and off from the console (D191): it writes the config file in the work folder (a dated copy first, in
  # work/config-history) and starts or stops their containers.
  ops:
    build:
      context: ./services/ops
    image: eaexplorer/ops:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    environment:
      EAX_OPS_TOKEN: ${EAX_OPS_TOKEN:-eax-ops-laptop}   # a server sets its own (the setup refuses this one there)
      EAX_PERSIST_DIR: /eax-persist      # persist/ as mounted below: the settings that survive resets (D558)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./work:/eax-work
      # the settings that survive resets (D558): schedules, the banner, the safety backups; outside work/, so no
      # cleanup, clean-run or clean-restart deletes them (EAX_PERSIST_DIR: another folder)
      - ${EAX_PERSIST_DIR:-./persist}:/eax-persist
      # every container's log, one file a day (R2.32): a folder outside work/ (no reset empties it); a mounted disk on a
      # server (EAX_LOGS_DIR)
      - ${EAX_LOGS_DIR:-./logs}:/eax-logs
      - ${EAX_BACKUP_DIR:-./work/backups}:/backups   # infrastructure backups: listed, pinned, cleaned, restored (D216, D226, R2.44)
      - ./docker-compose.yml:/eax-repo/docker-compose.yml:ro   # kept in each backup with the release and image versions
      - ./deploy:/eax-repo/deploy:ro
      - ./eaxcli:/eax-repo/eaxcli:ro                      # updates (phase 36, D417): the channels, versions and plan
      - ./services/api/version.toml:/eax-repo/services/api/version.toml:ro   # the installed version before any update
    networks: [backend, terminal]

  db:
    image: ${EAX_IMAGE_POSTGRES:-postgres:17-alpine}
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EAX_DB_SUPERUSER_PASSWORD:?set EAX_DB_SUPERUSER_PASSWORD in work/eaexplorer.env}
      POSTGRES_DB: postgres
      EAX_DB_NAME: ${EAX_DB_NAME:-eaexplorer}
      EAX_DB_PASSWORD: ${EAX_DB_PASSWORD:?set EAX_DB_PASSWORD}
      EAX_DB_REPORT_PASSWORD: ${EAX_DB_REPORT_PASSWORD:?set EAX_DB_REPORT_PASSWORD}
      EAX_DB_MIGRATOR_PASSWORD: ${EAX_DB_MIGRATOR_PASSWORD:?set EAX_DB_MIGRATOR_PASSWORD}
      EAX_KEYCLOAK_DB_PASSWORD: ${EAX_KEYCLOAK_DB_PASSWORD:?set EAX_KEYCLOAK_DB_PASSWORD}
      EAX_SUPERSET_DB_PASSWORD: ${EAX_SUPERSET_DB_PASSWORD:?set EAX_SUPERSET_DB_PASSWORD}
      EAX_SUPERSET_DB_HOST: ${EAX_SUPERSET_DB_HOST:-db}            # R2.50: its own server when set
      EAX_SUPERSET_DB_PORT: ${EAX_SUPERSET_DB_PORT:-5432}
      EAX_MAYAN_DB_PASSWORD: ${EAX_MAYAN_DB_PASSWORD:?set EAX_MAYAN_DB_PASSWORD}
    volumes:
      - ${EAX_DATA_DIR:-eax-pgdata}:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Valkey, used only by Mayan EDMS as its task queue and lock store (Celery broker).
  # Nothing of ours and not Superset uses it: their state lives in PostgreSQL.
  dms-broker:
    image: ${EAX_IMAGE_VALKEY:-valkey/valkey:8-alpine}
    <<: [*restart, *logging]
    command: ["valkey-server", "--requirepass", "${EAX_DMS_BROKER_PASSWORD:?set EAX_DMS_BROKER_PASSWORD}", "--save", ""]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${EAX_DMS_BROKER_PASSWORD}

  # ---------------------------------------------------------------- identity (out of the box)
  keycloak:
    image: ${EAX_IMAGE_KEYCLOAK:-quay.io/keycloak/keycloak:26.0}
    <<: [*restart, *logging]
    command: ["start", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${EAX_KEYCLOAK_DB_HOST:-db}:${EAX_KEYCLOAK_DB_PORT:-5432}/keycloak   # R2.50: its own server when set
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${EAX_KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${EAX_HOSTNAME:-localhost}:${EAX_HTTPS_PORT:-443}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${EAX_KC_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${EAX_KC_ADMIN_PASSWORD:?set EAX_KC_ADMIN_PASSWORD}
    volumes:
      - eax-kc-import:/opt/keycloak/data/import:ro
    networks: [frontend, backend]
    # ready when it answers a realm (the image has bash but no curl); the start waits for it before saying people can
    # sign in (the first tier of the start-up, D255)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ \"$$line\" == *' 200'* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------- diagrams (out of the box)
  drawio:
    # our own draw.io: the published image plus EA Explorer's plugin for drawn views (phase 28, D354, D396)
    build:
      context: ./deploy/drawio
      args:
        DRAWIO_IMAGE: ${EAX_IMAGE_DRAWIO:-jgraph/drawio:32.6.10}
    image: eaexplorer/drawio:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    networks: [frontend]

  # ---------------------------------------------------------------- reports (out of the box, plus drivers)
  reports-init:
    build:
      context: ./deploy/superset
      args:
        SUPERSET_IMAGE: ${EAX_IMAGE_SUPERSET:-apache/superset:4.1.2}
    image: eaexplorer/superset:${EAX_VERSION:-dev}
    command: ["/bin/sh", "/app/eax/superset-init.sh"]
    # a one-shot set-up: the Superset image's own health check (its web server) never answers here, so the container
    # showed "unhealthy" on every start (R2.20)
    healthcheck:
      disable: true
    env_file: work/eaexplorer.env
    environment:
      SUPERSET_CONFIG_PATH: /app/eax/superset_config.py
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - ./deploy/superset:/app/eax:ro
      - eax-rendered:/rendered:ro
      - eax-superset-home:/app/superset_home
    networks: [backend]
    <<: *logging

  reports:
    # Same image as reports-init. The build section is repeated so Compose builds it instead of
    # trying to pull eaexplorer/superset from Docker Hub (it is never published there).
    build:
      context: ./deploy/superset
      args:
        SUPERSET_IMAGE: ${EAX_IMAGE_SUPERSET:-apache/superset:4.1.2}
    image: eaexplorer/superset:${EAX_VERSION:-dev}
    <<: [*restart, *logging]
    # the server starts at once; the report dashboards and datasets load in the background (R2.39)
    command: ["/bin/sh", "/app/eax/reports-start.sh"]
    env_file: work/eaexplorer.env
    environment:
      SUPERSET_CONFIG_PATH: /app/eax/superset_config.py
    depends_on:
      reports-init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/superset:/app/eax:ro
      - eax-superset-home:/app/superset_home
    networks: [frontend, backend]

  # ---------------------------------------------------------------- documents (out of the box)
  dms:
    image: ${EAX_IMAGE_MAYAN:-mayanedms/mayanedms:s4}
    <<: [*restart, *logging]
    depends_on:
      db:
        condition: service_healthy
      dms-broker:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      MAYAN_DATABASES: '{"default":{"ENGINE":"django.db.backends.postgresql","NAME":"mayan","USER":"mayan","PASSWORD":"${EAX_MAYAN_DB_PASSWORD}","HOST":"${EAX_MAYAN_DB_HOST:-db}","PORT":"${EAX_MAYAN_DB_PORT:-5432}"}}'
      MAYAN_CELERY_BROKER_URL: redis://:${EAX_DMS_BROKER_PASSWORD_URLENC:?set EAX_DMS_BROKER_PASSWORD_URLENC}@dms-broker:6379/0
      MAYAN_CELERY_RESULT_BACKEND: redis://:${EAX_DMS_BROKER_PASSWORD_URLENC}@dms-broker:6379/1
      MAYAN_LOCK_MANAGER_BACKEND: mayan.apps.lock_manager.backends.redis_lock.RedisLock
      MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: '{"redis_url":"redis://:${EAX_DMS_BROKER_PASSWORD_URLENC}@dms-broker:6379/2"}'
      MAYAN_ALLOWED_HOSTS: '["*"]'
      MAYAN_CSRF_TRUSTED_ORIGINS: '["https://docs.${EAX_HOSTNAME:-localhost}:${EAX_HTTPS_PORT:-443}","https://docs.${EAX_HOSTNAME:-localhost}"]'
      # Sign-in through Keycloak. Discovery is fetched inside the Docker network; Keycloak then
      # hands the browser the public sign-in address and Mayan the internal token address.
      # To fall back to Mayan's own login, set EAX_MAYAN_AUTH_BACKEND in work/eaexplorer.env to
      # mayan.apps.authentication.authentication_backends.AuthenticationBackendModelUsernamePassword
      MAYAN_AUTHENTICATION_BACKEND: ${EAX_MAYAN_AUTH_BACKEND:-mayan.apps.authentication_oidc.authentication_backends.AuthenticationBackendOIDC}
      MAYAN_AUTHENTICATION_BACKEND_ARGUMENTS: '{"oidc_discovery_url":"http://keycloak:8080/auth/realms/${EAX_KEYCLOAK_REALM:-eaexplorer}/.well-known/openid-configuration","oidc_rp_client_id":"mayan","oidc_rp_client_secret":"${EAX_MAYAN_OIDC_SECRET}","oidc_rp_sign_algo":"RS256"}'
      # Behind the proxy: trust its https and host headers so redirects use https://docs.<host>
      MAYAN_SECURE_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO","https"]'
      MAYAN_USE_X_FORWARDED_HOST: "true"
      MAYAN_AUTOADMIN_USERNAME: ${EAX_MAYAN_ADMIN_USER:-admin}
      MAYAN_AUTOADMIN_PASSWORD: ${EAX_MAYAN_ADMIN_PASSWORD:?set EAX_MAYAN_ADMIN_PASSWORD}
      MAYAN_AUTOADMIN_EMAIL: ${EAX_FIRST_ADMIN_EMAIL:-admin@example.org}
    volumes:
      - ${EAX_DOCS_DIR:-eax-docs}:/var/lib/mayan
    networks: [frontend, backend]
